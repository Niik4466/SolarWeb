<header class="nav" role="navigation" aria-label="Principal">
  <div class="brand">
    <span class="logo">☀</span>
    <span class="title">SolarWeb</span>

    <!-- Botón hamburguesa: solo si está logueada -->
    <button
      *ngIf="auth.isLoggedIn()"
      class="hamburger"
      type="button"
      (click)="toggleMenu()"
      aria-label="Abrir menú"
      [attr.aria-expanded]="mobileOpen()"
      aria-controls="mobileMenu"
    >
      <span *ngIf="!mobileOpen()">☰</span>
    </button>
  </div>

  <!-- ✅ Tabs desktop -->
  <nav class="tabs" role="tablist">
    <!-- Inicio SIEMPRE visible (login o no) -->
    <a routerLink="/inicio" routerLinkActive="active" class="tab">Inicio</a>

    <!-- Otras pestañas SOLO si está logueada -->
    <ng-container *ngIf="auth.isLoggedIn()">
      <a routerLink="/graficos" routerLinkActive="active" class="tab">Gráficos</a>
      <a routerLink="/exportar" routerLinkActive="active" class="tab">Exportar</a>
      <a *ngIf="auth.isAdmin()" routerLink="/solicitudes" routerLinkActive="active" class="tab">
        Solicitudes
      </a>
      <a *ngIf="auth.isAdmin()" routerLink="/usuarios" routerLinkActive="active" class="tab">
        Usuarios
      </a>
      <a *ngIf="auth.isAdmin()" routerLink="/monitor-pc" routerLinkActive="active" class="tab">
        Estado del sistema
      </a>
    </ng-container>
  </nav>
<!-- Zona derecha del navbar -->
<div class="right" *ngIf="!isLogin() ">
  <!-- Botón cerrar sesión (desktop) -->
  <button
    *ngIf="auth.isLoggedIn(); else loginBtnTpl"
    class="btn-logout"
    (click)="logout()"
  >
    Cerrar sesión
  </button>

  <!-- Si NO está logueado: mostrar botón "Iniciar sesión" solo si estoy en /inicio -->
  <ng-template #loginBtnTpl>
    <button
      *ngIf="estaEnInicio()"
      class="btn-login"
      (click)="irALogin()"
    >
      Iniciar sesión / Registrarse
    </button>
  </ng-template>
</div>


</header>

<!-- ===== Menú móvil ===== -->
<div
  class="mobile-backdrop"
  *ngIf="auth.isLoggedIn() && mobileOpen()"
>
  <div class="mobile-panel" id="mobileMenu">
    <button
      class="mobile-close"
      type="button"
      (click)="closeMenu()"
      aria-label="Cerrar menú"
    >
      ✕
    </button>

    <nav class="mobile-links">
      <a routerLink="/inicio" routerLinkActive="active" (click)="closeMenu()">Inicio</a>
      <a routerLink="/graficos" routerLinkActive="active" (click)="closeMenu()">Gráficos</a>
      <a routerLink="/exportar" routerLinkActive="active" (click)="closeMenu()">Exportar</a>
      <a *ngIf="auth.isAdmin()" routerLink="/solicitudes" routerLinkActive="active" (click)="closeMenu()">
        Solicitudes
      </a>
      <a *ngIf="auth.isAdmin()" routerLink="/usuarios" routerLinkActive="active" (click)="closeMenu()">
        Usuarios
      </a>
      <a *ngIf="auth.isAdmin()" routerLink="/monitor-pc" routerLinkActive="active" class="tab">
        Estado del sistema
      </a>
      <button class="logout-mobile-red" (click)="logout()">
        Cerrar sesión
      </button>
    </nav>
  </div>
</div>
