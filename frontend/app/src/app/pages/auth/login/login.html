<div class="login-container">
  <form class="login-card" [formGroup]="form" (ngSubmit)="onSubmit()">
    <h1>Iniciar sesión</h1>

    <label for="email">Correo electrónico</label>
    <input id="email" type="email" formControlName="email" placeholder="usuario@ejemplo.cl" />

    <label for="password">Contraseña</label>
    <input
      id="password"
      [type]="mostrarPassword() ? 'text' : 'password'"
      formControlName="password"
      placeholder="••••••••"
    />

    <!-- 👇 Checkbox mostrar contraseña -->
    <div class="password-toggle">
      <input
        type="checkbox"
        id="showPass"
        [checked]="mostrarPassword()"
        (change)="mostrarPassword.set($event.target.checked)"
      />
      <label for="showPass">Mostrar contraseña</label>
    </div>

    <button type="submit">Ingresar</button>

    <p class="forgot">
      <a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
    </p>

    <p class="register">
      ¿No tienes cuenta?
      <a routerLink="/solicitar-registro">Solicitar registro</a>
    </p>
  </form>
</div>
