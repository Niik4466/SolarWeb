<div class="fp-wrap">
  <div class="card">
    <h1>Recuperar contraseña</h1>

    <p>
      Si olvidaste tu contraseña, contacta al administrador para solicitar el restablecimiento de tu acceso.
    </p>

    <p class="email">
      <strong>{{ adminEmail }}</strong>
    </p>

    <button type="button" (click)="contactarAdmin()">Contactar administrador</button>

    <p class="hint">
      Se abrirá tu aplicación de correo con un mensaje prellenado para el administrador.
    </p>

    <p class="back">
      <a routerLink="/login">Volver al inicio de sesión</a>
    </p>
  </div>
</div>
