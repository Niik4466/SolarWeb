<div class="fp-wrap">
  <form class="card" [formGroup]="form" (ngSubmit)="enviar()" *ngIf="!sent(); else okTpl">
    <h1>Recuperar contraseña</h1>

    <label for="email">Correo electrónico</label>
    <input id="email" type="email" formControlName="email" placeholder="usuario@ejemplo.cl" />

    <p *ngIf="error()" class="err">{{ error() }}</p>

    <button type="submit">Enviar enlace</button>

    <p class="hint">Te mostraremos un mensaje de confirmación. No se envía correo aún.</p>

    <!-- 👇 Añade este bloque para que se vea antes de enviar -->
    <p class="back">
      <a routerLink="/login">Volver al inicio de sesión</a>
    </p>
  </form>

  <ng-template #okTpl>
    <div class="card">
      <h1>Revisa tu correo</h1>
      <p>Si tu email está registrado, recibirás un enlace para restablecer la contraseña.</p>
      <p class="back">
        <a routerLink="/login">Volver al inicio de sesión</a>
      </p>
    </div>
  </ng-template>
</div>
