<!-- exportar.html-->

<h1 class="title">Exportar datos</h1>

<!--
  Layout principal con reactive forms:
  - [formGroup]="form" enlaza todo el subtree a tu FormGroup de exportar.ts.
  - Se divide visualmente en dos paneles: left (fechas) y right (opciones).
-->
<section class="layout" [formGroup]="form">
  <!-- =========================================
       Panel izquierdo: Calendario / selección
       - Muestra uno de dos bloques según granularidad (signal())
     ========================================= -->
  <div class="left">

    <!-- ======================
         Modo: Diario
         - Input date + botón "Agregar".
         - Lista de chips con las fechas seleccionadas (fechasDiarias()).
       ====================== -->
    <div *ngIf="granularidad() === 'diario'" class="calendar-block">
      <label for="fechaDiaria">Selecciona un día</label>
      <div class="row add-date">
        <!-- [formControl] para vincular el control fechaDiaria -->
        <input id="fechaDiaria" type="date" [formControl]="form.controls.fechaDiaria" />
        <button type="button" class="btn" (click)="addFechaDiaria()">Agregar</button>
      </div>

      <!-- Chips de fechas agregadas -->
      <div class="chips" *ngIf="fechasDiarias().length">
        <div class="chips-title">Vista previa de fechas seleccionadas:</div>
        <!-- Angular v17 '@for' con track por valor para mejor rendimiento -->
        @for (f of fechasDiarias(); track f) {
          <button
            type="button"
            class="chip"
            (click)="removeFechaDiaria(f)"
            aria-label="Quitar {{ f }}"
            title="Quitar {{ f }}"
          >
            {{ f }} <span aria-hidden="true">×</span>
          </button>
        }
      </div>
    </div>

    <!-- ======================
         Modo: Rango
         - Dos inputs date: inicio/fin
         - Mensaje de validación si inicio > fin
       ====================== -->
    <div *ngIf="granularidad() === 'rango'" class="range-block">
      <div class="row range-row">
        <div class="field">
          <label for="rangoInicio">Inicio</label>
          <input id="rangoInicio" type="date" [formControl]="form.controls.rangoInicio" />
        </div>
        <div class="field">
          <label for="rangoFin">Fin</label>
          <input id="rangoFin" type="date" [formControl]="form.controls.rangoFin" />
        </div>
      </div>

      <!-- Validación simple en plantilla (orden de fechas) -->
      <p class="muted" *ngIf="form.value.rangoInicio && form.value.rangoFin && form.value.rangoInicio! > form.value.rangoFin!">
        El inicio no puede ser posterior al fin.
      </p>
    </div>
  </div>

  <!-- =========================================
       Panel derecho: Opciones de exportación
       - Granularidad (toggle), Variables, Formato, Incluir imágenes, CTA
     ========================================= -->
  <aside class="right">
    <div class="panel">
      <!-- Selector de granularidad con botones segmentados
           - Usa signals (granularidad()) para estado y clases activas.
           - aria-pressed comunica estado a tecnologías asistivas. -->
      <div class="panel-title">Granularidad</div>
      <div class="segmented" role="group" aria-label="Granularidad">
        <button type="button"
                class="seg-btn"
                [class.active]="granularidad() === 'diario'"
                (click)="setGranularidad('diario')"
                aria-pressed="{{ granularidad() === 'diario' }}">
          Diario
        </button>
        <button type="button"
                class="seg-btn"
                [class.active]="granularidad() === 'rango'"
                (click)="setGranularidad('rango')"
                aria-pressed="{{ granularidad() === 'rango' }}">
          Rango
        </button>
      </div>

      <!-- Variables (checkboxes independientes)
           - Enlazadas directamente a los FormControls varGHI/varDNI/varDHI -->
      <div class="group">
        <div class="label">Variables</div>
        <label class="row"><input type="checkbox" [formControl]="form.controls.varGHI" /> GHI</label>
        <label class="row"><input type="checkbox" [formControl]="form.controls.varDNI" /> DNI</label>
        <label class="row"><input type="checkbox" [formControl]="form.controls.varDHI" /> DHI</label>
      </div>

      <!-- Formato e Incluir imágenes
           - Formato: radios ligados por formControlName="formato"
           - Incluir imágenes: tiene efecto sólo en modo Rango (el componente TS lo respeta) -->
      <div class="row between group">
        <div>
          <div class="label">Formato</div>
          <label class="row">
            <input
              type="radio"
              name="formato"
              formControlName="formato"
              value="csv"
            /> CSV
          </label>
          <label class="row">
            <input
              type="radio"
              name="formato"
              formControlName="formato"
              value="json"
            /> JSON
          </label>
        </div>

        <div>
          <div class="label">¿Incluir imágenes?</div>
          <label class="row">
            <input type="checkbox" formControlName="incluirImagenes" /> Sí
          </label>
          <!-- Nota: En modo 'diario' este valor se ignora según la lógica de exportar.ts -->
        </div>
      </div>

      <!-- CTA Exportar
           - Se habilita sólo si puedeExportar() es true (validaciones mínimas).
           - Llama a exportar() en click. -->
      <div class="actions">
        <button type="button" class="btn primary cta"
                [disabled]="!puedeExportar()"
                (click)="exportar()">
          EXPORTAR
        </button>
      </div>
    </div>
  </aside>
</section>
