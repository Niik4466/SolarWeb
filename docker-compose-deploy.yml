services:
  # ==========================================
  # BASE DE DATOS (Postgres)
  # ==========================================
  database-solarweb:
    image: postgres:16
    container_name: grupo2_solarweb_db
    restart: unless-stopped
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA=/var/lib/postgresql/data/pgdata
      - PGPORT=${POSTGRES_PORT}
    volumes:
      - db_data:/var/lib/postgresql/data/pgdata
      - ./databases/postgres/db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - red_taller_software
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    labels:
      - "org.uach.group=grupo2"
      - "org.uach.project=solarweb"
      - "org.uach.service=database"
      - "logging=portmail" 
  # ==========================================
  # BACKEND (FastAPI)
  # ==========================================
  backend-solarweb:
    environment:
      - TZ=America/Santiago 
      - POSTGRES_HOST=database-solarweb
    build:
      context: ./backend
      dockerfile: Dockerfile-production
    container_name: grupo2_solarweb_backend
    restart: unless-stopped
    ports:
      - "4002:4002"
    depends_on:
      - database-solarweb
    networks:
      - red_taller_software
    volumes:
      - ./.env:/app/backend/.env
      - zerotier-data:/var/lib/zerotier-one
    env_file:
      - .env
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "700M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    labels:
      - "org.uach.group=grupo2"
      - "org.uach.project=solarweb"
      - "org.uach.service=backend"
      - "logging=portmail" 
  # ==========================================
  # FRONTEND (Angular)
  # ==========================================
  frontend-solarweb:
    build:
      context: ./frontend
      dockerfile: Dockerfile-production
    container_name: grupo2_solarweb_frontend
    restart: unless-stopped
    environment:
      - TZ=America/Santiago 
    expose:
      - "3002"
    networks:
      - red_taller_software
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: "400M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    labels:
      - "org.uach.group=grupo2"
      - "org.uach.project=solarweb"
      - "org.uach.service=frontend"
      - "logging=portmail" 
  # ==========================================
  # CADDY (Reverse Proxy)
  # ==========================================
  caddy:
    image: caddy:2
    container_name: grupo2_solarweb_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - red_taller_software
    dns:
      - 1.1.1.1
      - 8.8.8.8


volumes:
  zerotier-data:
  db_data:
  caddy_data:
  caddy_config:

# Configuracion de red
networks:
  red_taller_software:
    external: true
