services:
  frontend-solarweb-production:
    build:
      context: ./frontend
      dockerfile: Dockerfile-production
    container_name: frontend-solarweb
    # SOLO PARA DEBUG
    # ports:
    #   - "3002:80"
    restart: unless-stopped
    volumes:
      - ./frontend/Caddyfile:/etc/caddy/Caddyfile
    networks:
      - red_taller_software

  backend-solarweb:
    build:
      context: ./backend
      dockerfile: Dockerfile-production
    container_name: backend-solarweb
    # SOLO PARA DEBUG
    ports:
      - "4002:4002"
    volumes:
      - ./.env:/app/backend/.env
      - zerotier-data:/var/lib/zerotier-one
    env_file:
      - .env
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun
    networks:
      - red_taller_software

  postgres-solarweb:
    image: postgres:16
    container_name: postgres-solarweb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      PGPORT: ${POSTGRES_PORT}
    #ports:
      #- "5002:5002"
    volumes:
      - postgresdb:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - red_taller_software

  migrator:
    image: postgres:16
    depends_on:
      postgres-solarweb:
        condition: service_healthy
    volumes:
      - ./databases/postgres/db.sql:/migrations/01_schema.sql:ro
    networks:
      - red_taller_software
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh","-c"]
    command: >
      "psql -h ${POSTGRES_HOST} -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT} -v ON_ERROR_STOP=1 -f /migrations/01_schema.sql && echo '✅ Migraciones aplicadas' || (echo '❌ Error en migraciones' && exit 1)"


volumes:
  postgresdb:
  zerotier-data:


# Configuracion de red
networks:
  red_taller_software:
    external: true
